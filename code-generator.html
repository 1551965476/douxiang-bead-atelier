<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>豆像工坊｜兑换码生成器</title><style>body{max-width:760px;margin:36px auto;padding:0 18px;font:16px system-ui;color:#30293a;background:#fff8fa}main{background:#fff;padding:26px;border-radius:16px;box-shadow:0 4px 20px #4b30511a}label{display:block;margin:14px 0 5px}input,button,textarea{font:inherit;padding:9px;border:1px solid #d9cbd6;border-radius:8px}button{background:#754f78;color:white;border:0;cursor:pointer;margin:14px 8px 14px 0}textarea{width:100%;min-height:220px;box-sizing:border-box;font:13px ui-monospace}small{color:#756b79}</style><main><h1>豆像工坊兑换码生成器</h1><p>此工具只在你的电脑上使用。生成后保存 CSV，再把“网站配置”复制到 <code>redemption-codes.js</code> 并重新构建网站。</p><label>兑换码前缀 <input id="prefix" value="DOUX-"></label><label>每个兑换码积分 <input id="credits" type="number" min="1" value="3"></label><label>生成数量 <input id="amount" type="number" min="1" max="1000" value="20"></label><button id="make">生成兑换码</button><button id="csv">下载 CSV</button><label>发给用户的兑换码</label><textarea id="codes" readonly></textarea><label>网站配置（复制替换 redemption-codes.js 中的数组）</label><textarea id="config" readonly></textarea><small>静态测试版仅能防止同一浏览器重复兑换；请妥善保存 CSV。</small></main><script>let rows=[];const $=id=>document.getElementById(id),hash=async s=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};$('make').onclick=async()=>{const n=Math.max(1,Math.min(1000,+$('amount').value||1)),credit=Math.max(1,Math.floor(+$('credits').value||1)),pre=$('prefix').value.toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,20);rows=[];for(let i=0;i<n;i++){const raw=crypto.getRandomValues(new Uint32Array(2));const code=pre+raw[0].toString(36).toUpperCase()+raw[1].toString(36).toUpperCase();rows.push({code,credits:credit,hash:await hash(code)});}$('codes').value=rows.map(r=>r.code+' · '+r.credits+' 积分').join('\n');$('config').value='const REDEMPTION_CODES = Object.freeze('+JSON.stringify(rows.map(({hash,credits})=>({hash,credits})),null,2)+');';};$('csv').onclick=()=>{const data='兑换码,积分\n'+rows.map(r=>r.code+','+r.credits).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+data],{type:'text/csv'}));a.download='豆像工坊-兑换码.csv';a.click();};</script>
